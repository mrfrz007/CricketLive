<div class="flex flex-col lg:flex-row gap-8">
    <!-- Left Side: Input and Controls -->
    <div class="lg:w-1/3 bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">Enter Details</h2>
      <div class="mb-6">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Participant's Name</label>
        <input
          type="text"
          id="name"
          [(ngModel)]="participantName"
          (ngModelChange)="updatePreview()"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
          placeholder="e.g., John Doe"
        />
      </div>
      <button
        (click)="downloadAsPdf()"
        [disabled]="!participantName.trim()"
        class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition duration-300 disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
        Download as PDF
      </button>
       <p *ngIf="isGenerating" class="text-center mt-4 text-sm text-gray-600">Generating PDF, please wait...</p>
    </div>
  
    <!-- Right Side: Certificate Preview -->
    <div class="lg:w-2/3 bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">Live Preview</h2>
      <div id="certificate-wrapper" class="relative w-full border border-gray-200 rounded-md overflow-hidden">
        <img src="assets/certificate-template.jpeg" alt="Certificate Background" class="w-full h-auto" />
        <div
          class="absolute text-center w-full"
          [style.top]="'53%'"
          [style.left]="'50%'"
          [style.transform]="'translate(-50%, -50%)'"
        >
          <span
            class="text-1xl md:text-3xl lg:text-4xl"
            [style.fontFamily]="'Great Vibes, cursive'"
            [style.color]="'#333'"
          >
            {{ previewName }}
          </span>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Add Google Font for cursive style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
